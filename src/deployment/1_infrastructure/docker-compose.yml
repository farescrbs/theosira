# 🚀 THESORIA - Infrastructure Production Docker
# Déploiement ultra-optimisé pour latence minimale

version: '3.8'

services:
  # ============================================
  # 1. ERIGON NODE (Auto-hébergé - OPTIMAL)
  # ============================================
  erigon:
    image: thorax/erigon:latest
    container_name: thesoria-erigon
    restart: always
    ports:
      - "8545:8545"   # HTTP RPC
      - "8546:8546"   # WebSocket
      - "9090:9090"   # Metrics
    volumes:
      - erigon-data:/home/erigon/.local/share/erigon
      - ./erigon-config:/config
    command: |
      --chain mainnet
      --datadir /home/erigon/.local/share/erigon
      --private.api.addr 0.0.0.0:9090
      --http
      --http.addr 0.0.0.0
      --http.port 8545
      --http.api eth,net,web3,trace,txpool
      --http.vhosts *
      --ws
      --maxpeers 100
      --prune htc
      --prune.h.before 90000
      --prune.r.before 90000
      --prune.t.before 90000
      --prune.c.before 90000
    environment:
      - ERIGON_DISABLE_TXP_GOSSIP=true
    networks:
      - thesoria-network
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 32G

  # ============================================
  # 2. REDIS CACHE (Performance)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: thesoria-redis
    restart: always
    ports:
      - "6379:6379"
    command: |
      redis-server
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    volumes:
      - redis-data:/data
    networks:
      - thesoria-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # ============================================
  # 3. AGENT MEV (Python)
  # ============================================
  agent-mev:
    build:
      context: ../../
      dockerfile: ./deployment/1_infrastructure/Dockerfile.agent
    container_name: thesoria-agent
    restart: always
    depends_on:
      - redis
      - erigon
    environment:
      # Blockchain
      - ETHEREUM_RPC_URL=http://erigon:8545
      - ETHEREUM_WS_URL=ws://erigon:8546
      - POLYGON_RPC_URL=${POLYGON_RPC_URL}
      - PRIVATE_KEY=${PRIVATE_KEY}
      
      # Flashbots
      - FLASHBOTS_RELAY=https://relay.flashbots.net
      
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      
      # IA
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_ENABLED=true
      
      # Trading
      - MIN_PROFIT_USD=100
      - MAX_FLASH_LOAN=10000000
      - MIN_SPREAD=0.005
      
      # Performance
      - SCAN_INTERVAL_MS=100
      - PARALLEL_SCANS=50
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - thesoria-network
    deploy:
      resources:
        limits:
          cpus: '12'
          memory: 16G
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; r=redis.Redis(host='redis'); r.ping()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # 4. ARTEMIS SCANNER (Rust - Ultra-rapide)
  # ============================================
  artemis:
    build:
      context: ../../
      dockerfile: ./deployment/1_infrastructure/Dockerfile.artemis
    container_name: thesoria-artemis
    restart: always
    depends_on:
      - redis
      - erigon
    environment:
      - ETH_RPC_URL=http://erigon:8545
      - ETH_WS_URL=ws://erigon:8546
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./artemis-config.toml:/config/artemis.toml
      - ./logs:/app/logs
    networks:
      - thesoria-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  # ============================================
  # 5. MONITORING (Prometheus + Grafana)
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: thesoria-prometheus
    restart: always
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - thesoria-network

  grafana:
    image: grafana/grafana:latest
    container_name: thesoria-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    networks:
      - thesoria-network

  # ============================================
  # 6. NGINX REVERSE PROXY (Sécurité)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: thesoria-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - erigon
      - grafana
    networks:
      - thesoria-network

# ============================================
# NETWORKS
# ============================================
networks:
  thesoria-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================
# VOLUMES
# ============================================
volumes:
  erigon-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
